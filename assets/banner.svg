<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hexagon CI — Deterministic Source-Derived Call Graphs for Go Test Impact Analysis">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101D"/>
      <stop offset="55%" stop-color="#0F1B30"/>
      <stop offset="100%" stop-color="#132640"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1E3454" stroke-width="1.5"/>

  <!-- Subtle grid dots -->
  <g fill="#264066" opacity="0.35">
    <circle cx="48" cy="44" r="1.5"/><circle cx="88" cy="44" r="1.5"/><circle cx="128" cy="44" r="1.5"/>
    <circle cx="48" cy="84" r="1.5"/><circle cx="88" cy="84" r="1.5"/><circle cx="128" cy="84" r="1.5"/>
    <circle cx="48" cy="240" r="1.5"/><circle cx="88" cy="240" r="1.5"/><circle cx="128" cy="240" r="1.5"/>
    <circle cx="48" cy="280" r="1.5"/><circle cx="88" cy="280" r="1.5"/><circle cx="128" cy="280" r="1.5"/>
  </g>

  <!-- Left Title Block -->
  <rect x="64" y="64" width="56" height="4" rx="2" fill="url(#accentBar)"/>
  <text x="64" y="132" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Hexagon CI</text>
  <text x="64" y="172" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Deterministic source-derived call graphs for Go test impact analysis</text>

  <!-- Feature Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="64" y="210" width="96" height="32" rx="16" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="112" y="231" text-anchor="middle" fill="#7DD3FC">Go 1.24+</text>

    <rect x="172" y="210" width="114" height="32" rx="16" fill="#0D2F2A" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="229" y="231" text-anchor="middle" fill="#6EE7B7">Graph v2</text>

    <rect x="298" y="210" width="152" height="32" rx="16" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="374" y="231" text-anchor="middle" fill="#7DD3FC">Compact .hgc.gz</text>

    <rect x="462" y="210" width="144" height="32" rx="16" fill="#17253D" stroke="#64748B" stroke-opacity="0.5"/>
    <text x="534" y="231" text-anchor="middle" fill="#CBD5E1">Zero-Exec AST</text>
  </g>

  <!-- Right Call-Graph Hexagon Visual -->
  <g transform="translate(770, 32)">
    <!-- Outer ghost hexagon -->
    <polygon points="180,14 298,82 298,218 180,286 62,218 62,82" fill="#0C1729" fill-opacity="0.65" stroke="#1E3A5F" stroke-width="1.5"/>
    <!-- Inner highlighted hexagon -->
    <polygon points="180,46 270,98 270,202 180,254 90,202 90,98" fill="none" stroke="url(#hexStroke)" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>

    <!-- Directed edges from changed fn -> callers -> test roots -->
    <g stroke-width="2.2" fill="none">
      <path d="M180,150 L118,108" stroke="#38BDF8"/>
      <path d="M180,150 L242,108" stroke="#38BDF8"/>
      <path d="M118,108 L180,46" stroke="#34D399"/>
      <path d="M242,108 L270,98" stroke="#34D399"/>
      <path d="M180,150 L180,214" stroke="#64748B" stroke-dasharray="4 4"/>
      <path d="M118,108 L90,202" stroke="#475569" stroke-dasharray="4 4"/>
    </g>

    <!-- Center changed function node -->
    <circle cx="180" cy="150" r="24" fill="#0E2A47" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)"/>
    <text x="180" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#E0F2FE">diff()</text>

    <!-- Intermediate caller nodes -->
    <circle cx="118" cy="108" r="15" fill="#132945" stroke="#38BDF8" stroke-width="2"/>
    <text x="118" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#BAE6FD">fnA</text>

    <circle cx="242" cy="108" r="15" fill="#132945" stroke="#38BDF8" stroke-width="2"/>
    <text x="242" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#BAE6FD">fnB</text>

    <!-- Impacted Test Root nodes -->
    <circle cx="180" cy="46" r="17" fill="#0D332B" stroke="#34D399" stroke-width="2.5" filter="url(#glow)"/>
    <text x="180" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#A7F3D0">Test1</text>

    <circle cx="270" cy="98" r="17" fill="#0D332B" stroke="#34D399" stroke-width="2.5" filter="url(#glow)"/>
    <text x="270" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#A7F3D0">Test2</text>

    <!-- Unaffected / fallback nodes -->
    <circle cx="180" cy="214" r="13" fill="#132036" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="202" r="13" fill="#132036" stroke="#475569" stroke-width="1.5"/>
    <circle cx="270" cy="202" r="11" fill="#132036" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
