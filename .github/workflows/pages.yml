name: Deploy branch pages to GitHub Pages

on:
  push:
    branches:
      - surya/provenance
      - aayush/graph-explorer
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check out the provenance branch page
        uses: actions/checkout@v4
        with:
          ref: surya/provenance
          path: pages-source/surya-provenance

      - name: Check out the graph explorer branch page
        uses: actions/checkout@v4
        with:
          ref: aayush/graph-explorer
          path: pages-source/graph-explorer

      - name: Assemble branch-specific pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/surya-provenance dist/aayush-graph-explorer
          cp -R pages-source/surya-provenance/site/. dist/surya-provenance/
          cp -R pages-source/graph-explorer/site/test-graphs/. dist/aayush-graph-explorer/
          touch dist/.nojekyll
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="Interactive DevRev graph and coverage explorers, published from separate Git branches.">
            <title>Hexagon CI · Branch Explorers</title>
            <style>
              :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b0e13; color: #e7eaf1; }
              * { box-sizing: border-box; }
              body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; }
              main { width: min(760px, 100%); }
              .eyebrow { color: #53d7c2; font: 11px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
              h1 { margin: 14px 0 8px; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.05em; }
              p { color: #9aa5b4; line-height: 1.65; }
              nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 30px; }
              a { display: block; padding: 22px; border: 1px solid #293340; border-radius: 10px; background: #111720; color: #e7eaf1; text-decoration: none; }
              a:hover { border-color: #53d7c2; background: #141e23; }
              strong { display: block; margin-bottom: 9px; font-size: 16px; }
              code { color: #7edcca; font: 11px ui-monospace, monospace; }
              small { display: block; margin-top: 12px; color: #8792a1; line-height: 1.5; }
            </style>
          </head>
          <body>
            <main>
              <div class="eyebrow">Hexagon CI · GitHub Pages</div>
              <h1>Branch explorers</h1>
              <p>Each page is built from its own branch and has a stable link.</p>
              <nav aria-label="Branch websites">
                <a href="./surya-provenance/">
                  <strong>Lifejacket Coverage</strong>
                  <code>surya/provenance</code>
                  <small>Compare service code with Lifejacket test inputs and checks.</small>
                </a>
                <a href="./aayush-graph-explorer/">
                  <strong>DevRev Function Graph Explorer</strong>
                  <code>aayush/graph-explorer</code>
                  <small>Explore function callers, callees, and related tests across DevRev repositories.</small>
                </a>
              </nav>
            </main>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
