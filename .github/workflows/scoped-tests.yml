name: Scoped tests

on:
  workflow_call:
    inputs:
      plan_artifact:
        description: Name of the artifact containing the planner JSON file
        required: true
        type: string
      checkout_ref:
        description: Exact repository revision analyzed by the planner
        required: true
        type: string
      go_version:
        description: Go toolchain version recorded in the plan
        required: true
        type: string
      cgo_enabled:
        description: CGO_ENABLED value recorded in the plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-selected-tests:
    name: Run planner-selected Go tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: ${{ inputs.cgo_enabled }}
    steps:
      - name: Check out the analyzed pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Download structured test plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan_artifact }}
          path: ${{ runner.temp }}/test-impact-plan

      - name: Run only selected tests
        run: >-
          python -m test_call_graph.runner
          --plan "$RUNNER_TEMP/test-impact-plan/test-impact-plan.json"
          --repository "$GITHUB_WORKSPACE"
